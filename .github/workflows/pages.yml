name: Deploy gallery (Pages)

on:
  push:
    # `redesign` inclus pendant la phase de refonte : la galerie live reflète le
    # travail en cours (l'URL Pages est unique → dernier push gagnant). À retirer
    # une fois `redesign` mergée dans `main`.
    branches: [main, redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site (gallery + tokens + styles)
        run: |
          mkdir -p _site
          cp gallery.html _site/index.html
          cp -r tokens styles _site/
          cp package.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
