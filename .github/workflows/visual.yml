name: Visual regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    name: Gallery screenshots vs baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # --ignore-scripts : évite le `prepare` de dls-core (pas besoin de builder
      # le package pour servir gallery.html + les CSS committés).
      - run: npm i -D @playwright/test@1.49.0 --no-save --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c visual/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
