name: Update visual baselines

# Régénère les captures de référence (Linux) et les committe sur la branche
# courante. À lancer une fois pour amorcer, puis à chaque redesign validé.
#   gh workflow run "Update visual baselines" --ref <branche>
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -D @playwright/test@1.49.0 --no-save --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c visual/playwright.config.ts --update-snapshots
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual/__screenshots__
          git commit -m "chore(visual): update gallery baselines" || { echo "Aucun changement de baseline."; exit 0; }
          git push
